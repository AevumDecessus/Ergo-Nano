name: Build PCBs and Plates

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      docker_image:
        description: "Override ERGOGEN_DOCKER_IMAGE (defaults to repository variable)"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Rewrite submodule SSH URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run build
        env:
          CONTAINER_CMD: docker
          ERGOGEN_DOCKER_IMAGE: ${{ inputs.docker_image || vars.ERGOGEN_DOCKER_IMAGE }}
        run: sh ./build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ergonano-build
          path: |
            gerbers/
            docs/images/
            cases/*.stl
            outlines/*.dxf
            !**/_*
            !**/_*/**

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -t files < <(find gerbers docs/images cases outlines -maxdepth 1 -type f ! -name '_*' \( -name '*.zip' -o -name '*.stl' -o -name '*.png' -o -name '*.dxf' \) | sort)
          version="${RELEASE_TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          elif [ -s /tmp/release-notes.md ]; then
            gh release create "$RELEASE_TAG" "${files[@]}" --notes-file /tmp/release-notes.md
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --generate-notes
          fi
