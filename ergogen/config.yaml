meta:
  engine: 4.1.0
units:
  # Web View Resizing
  $default_width: U
  $default_height: U
  # Proxy Spacing Variables
  kx: U
  ky: U
  ks: 19 # horizontal space between columns (default: 19)
  kp: 19 # vertical padding between keys (deafult: 19)
  half_kx: 0.5kx
  half_ky: 0.5ky
  kcow: 14 #key cutout hole width
  kcoh: 14 #key cutout hole height
  # Padding Variables
  padding: 7
  px: kx + padding
  py: ky + padding
  half_px: 0.5px
  half_py: 0.5py
  dpx: 2px
  dpy: 2py
  # MCU
  mcu_width: 18.3
  mcu_height: 34.1
  # Relative column staggers
  st_outer: 0
  st_pinky: 0
  st_ring: 5
  st_middle: 5
  st_index: -5
  st_inner: -5
  st_innermod: 0
  # pre-evaluate target traces between column staggers
  diode_x: -6
  diode_y: 7 #Negative to place the diode, positive for routing position
  diode_length: 4
  start_y: diode_y + diode_length # Diode bottom is at
  y_outer_to_pinky: start_y + st_pinky
  y_pinky_to_ring: start_y + st_ring
  y_ring_to_middle: start_y + st_middle
  y_middle_to_index: start_y + st_index
  y_index_to_inner: start_y + st_inner
  y_inner_to_innermod: start_y + st_innermod
  # kicad shifts
  kicad_shift_x: 50
  kicad_shift_y: -125
  # Tolerances
  board_tolerance: 0.3 #Leave this much space around the board in the case
  # Mounting holes
  m3: 3.2
  m3_heatset_hole: 4.5
  m3_heatset_height: 4
  standoff_size: m3_heatset_hole + (padding / 2)
  # plate sizes
  pcb_thickness: 1.6
  plate_thickness: 1.5
  top_plate_surface: 5
  gap_pcb_top_plate: top_plate_surface - plate_thickness
  wall_height: m3_heatset_height + pcb_thickness + plate_thickness + gap_pcb_top_plate
  # Extrudes the walls to be level with the top of the PCB
points:
  zones:
    matrix:
      key:
        padding: kp
        tags:
          - key
          - matrix_key
      anchor:
        shift: [kicad_shift_x, kicad_shift_y]
      columns:
        outer:
          key:
            column_net: CL0
            stagger: st_outer
        pinky:
          key:
            column_net: CL1
            stagger: st_pinky
        ring:
          key:
            column_net: CL2
            stagger: st_ring
        middle:
          key:
            column_net: CL3
            stagger: st_middle
        index:
          key:
            column_net: CL4
            stagger: st_index
        inner:
          key:
            column_net: CL5
            stagger: st_inner
          rows.mod.skip: true
        innermod:
          key: 
            column_net: CL6
            stagger: st_innermod
          rows.mod.skip: true
      rows:
        mod:
          row_net: RW4
        bottom:
          row_net: RW3
        home:
          row_net: RW2
        top:
          row_net: RW1
        num:
          row_net: RW0
    thumbs:
      key:
        padding: 1kp
        spread: 1ky
        tags:
          - key
          - thumb_cluster
      anchor:
        ref: matrix_index_mod
        shift: [half_kx,-1.25ky]
        rotate: -50
      columns:
        t_col0:
          key:
            column_net: CL7
            height: 2ky
            shift: [0, half_ky]
          rows.far.skip: true
          rows.near.row_net: RW0
        t_col1:
          key:
            column_net: CL7
          rows.near.row_net: RW4
          rows.far.row_net: RW1
        t_col2:
          key:
            column_net: CL7
          rows.near.row_net: RW3
          rows.far.row_net: RW2
      rows:
        near:
        far:
    screw_top_left:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_outer_num
        shift: [half_kx, -half_ky]
    screw_top_center:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_index_num
        shift: [half_kx, half_ky]
    screw_top_right:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_innermod_num
        shift: [half_kx, -half_ky]
    screw_bottom_left:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_outer_mod
        shift: [half_kx, half_ky]
    screw_center:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_index_mod
        shift: [half_kx, -half_ky]
    screw_center_bottom:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_ring_mod
        shift: [half_kx, -half_ky]
    screw_thumbs_right_center:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: thumbs_t_col2_near
        shift: [-half_kx, half_ky]
    screw_bottom_right:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_innermod_bottom
        shift: [half_kx, half_ky]
    mcu_cover_top_left:
      key.tags:
        - helper
        - mcu
      anchor:
        - ref: matrix_innermod_num
          shift: [kx,5]
    mcu_cover_top_right:
      key.tags:
        - helper
        - mcu
      anchor:
        - ref: mcu_cover_top_left
          shift: [mcu_width,0]
    mcu_cover_bottom_right:
      key.tags:
        - helper
        - mcu
      anchor:
        - ref: mcu_cover_top_right
          shift: [0,-mcu_height]
    mcu_cover_bottom_left:
      key.tags:
        - helper
        - mcu
      anchor:
        - ref: mcu_cover_top_left
          shift: [0,-mcu_height]
outlines:
  _matrix_outline:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_outer_num
          shift: [-half_px,half_py]
        - ref: matrix_ring_num
          shift: [-half_px,half_py]
        - ref: matrix_middle_num
          shift: [-half_px,half_py]
        - ref: matrix_middle_num
          shift: [half_px,half_py]
        - ref: matrix_innermod_num
          shift: [half_px,half_py]
        - ref: matrix_innermod_bottom
          shift: [half_px,-half_py]
        - ref: thumbs_t_col2_far
          shift: [half_px,half_py]
        - ref: thumbs_t_col2_near
          shift: [half_px,-half_py]
        - ref: thumbs_t_col1_near
          shift: [-half_px,-half_py]
        - ref: matrix_index_mod
          shift: [-half_px,-half_py]
        - ref: matrix_ring_mod
          shift: [half_px, -half_py]
        - ref: matrix_pinky_mod
          shift: [half_px, -half_py]
        - ref: matrix_outer_mod
          shift: [-half_px,-half_py]
      fillet: 2
  _mcu_outline:
    - what: polygon
      operation: stack
      points:
        - ref: mcu_cover_top_left
          shift: [-padding, padding]
        - ref: mcu_cover_top_right # bottom right space for the MCU
          shift: [padding, padding]
        - ref: mcu_cover_bottom_right
          shift: [padding, -padding]
        - ref: mcu_cover_bottom_left
          shift: [-padding, -padding]
      fillet: 2
  _pcb_outline:
    - what: outline
      name: _mcu_outline
    - what: outline
      name: _matrix_outline
      operation: add
      fillet: 2
  _mcu_tight:
    - what: polygon
      operation: stack
      points:
        - mcu_cover_top_left
        - mcu_cover_top_right
        - mcu_cover_bottom_right
        - mcu_cover_bottom_left
  _mcu_tolerance:
    - what: outline
      name: _mcu_tight
      expand: board_tolerance
      fillet: 2
  _standoffs:
    - what: circle
      radius: standoff_size / 2
      where: /screw/
  _standoff_holes:
    - what: circle
      radius: m3_heatset_hole / 2
      where: /screw/
  _switch_cutouts:
    - what: rectangle
      fillet: 2
      where: /key/
      size: [kcow, kcoh]
  switch_plate:
    - what: outline
      name: _matrix_outline
    - what: outline
      name: _standoff_holes
      operation: subtract
    - what: outline
      name: _switch_cutouts
      operation: subtract
  _pcb_with_border: # 0.5 padding bigger than board
    - what: outline
      name: _pcb_outline
      expand: 0.5padding
  _pcb_tolerance:
    - what: outline
      name: _pcb_outline
      expand: board_tolerance
  _case_wall: # a wall of only 0.5 padding bigger than the board
    - name: _pcb_with_border
    - operation: subtract
      name: _pcb_tolerance
  combo:
    - name: _pcb_outline
    - operation: subtract
      name: _switch_cutouts
    - operation: subtract
      name: _mcu_tight
pcbs:
  board:
    template: kicad8
    outlines:
      main:
        outline: _pcb_outline
    footprints:
      mx:
        what: ceoloide/switch_mx
        where: /key/
        params:
          hotswap: true
          hotswap_pads_same_side: true
          reversible: true
          include_silkscreen: true
          include_corner_marks: true
          locked_traces_vias: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: ceoloide/diode_tht_sod123
        where: /key/
        params:
          reversible: true
          include_tht: true
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [diode_x, -diode_y]
          rotate: 90
      nice-nano:
        what: ceoloide/mcu_nice_nano
        params:
          reverse_mount: true
          reversible: true
          P1: CS
          P2: MOS
          P3: SCK
          P5: RW0
          P6: RW1
          P7: RW2
          P8: RW3
          P9: RW4
          P21: CL0
          P20: CL1
          P19: CL2
          P18: CL3
          P15: CL4
          P14: CL5
          P16: CL6
          P10: CL7
        where:
          ref: mcu_cover_top_left
          shift: [(mcu_width / 2), -(mcu_height / 2)]
      nice-view:
        what: ceoloide/display_nice_view
        where:
          ref: mcu_cover_top_left
          shift: [(mcu_width / 2), -(mcu_height / 2)]
        params:
          reversible: true
      battery_jst:
        what: ceoloide/battery_connector_jst_ph_2
        where:
          ref: matrix_innermod_num
          shift: [0.75kx,-0.25ky]
          rotate: 180
        params:
          reversible: true
          include_traces: true
      power_switch:
        what: ceoloide/power_switch_smd_side
        where:
          ref: matrix_innermod_num
          shift: [.75kx,0.35py]
          rotate: 90
        params:
          reversible: true
          from: BAT_P
          to: VCC
      reset_switch:
        what: ceoloide/reset_switch_tht_top
        where:
          ref: matrix_innermod_top
          shift: [0.75kx, 0]
          rotate: 90
        params:
          reversible: true
      board_name:
        what: ceoloide/utility_text
        where:
          ref: matrix_outer_num
          shift: [0.5kx, 0.6ky]
        params:
          reversible: true
          bold: true
          height: 3
          width: 3
          text: "Ergo-Nano"
      board_version:
        what: ceoloide/utility_text
        where:
          ref: matrix_ring_num
          shift: [0, 0.5ky]
        params:
          reversible: true
          bold: true
          height: 3
          width: 3
          text: "V1.0"
      author:
        what: ceoloide/utility_text
        where:
          ref: matrix_outer_num
          shift: [0.6kx, 0.4ky]
        params:
          reversible: true
          bold: false
          height: 1
          width: 1
          text: "by Aevum Decessus"
      left_hand:
        what: ceoloide/utility_text
        where:
          ref: [matrix_inner_num]
          shift: [0.25kx, 0.5ky]
        params:
          side: F
          mirrored: false
          bold: true
          height: 3
          width: 3
          text: Left Hand
      right_hand:
        what: ceoloide/utility_text
        where:
          ref: [matrix_inner_num]
          shift: [0.25kx, 0.5ky]
        params:
          side: B
          mirrored: true
          bold: true
          height: 3
          width: 3
          text: Right Hand
      board_mounting_holes:
        what: ceoloide/mounting_hole_npth
        where: /screw/
        params:
          hole_size: m3
          hole_drill: m3
          designator: 'MH'
      key_diode_routes:
        what: ceoloide/utility_router
        where: /key/
        params:
          net: "{{colrow}}"
          route: "f(-7.75,-5)(-9,-4)(-9,-1)(-6,3)"
          locked: true
      col_routes:
        what: ceoloide/utility_router
        where: /^matrix_.*_(?!num)/
        params:
          net: "{{col_net}}"
          route: "b(7.75,-5)(7.75,-7)(7,-8)(7,-19)(7.75,-20)(7.75,-24)"
          locked: true
cases:
  _xl_bottom:
    - name: _pcb_with_border
      extrude: plate_thickness
  _wall:
    - name: _case_wall
      extrude: wall_height
  _case_standoffs:
    - name: _standoffs
      extrude: m3_heatset_height
  _case_standoff_holes:
    - name: _standoff_holes
      extrude: m3_heatset_height
  bottom_case:
    - what: case
      name: _xl_bottom
      operation: add
    - what: case
      name: _wall
      operation: add
    - what: case
      name: _case_standoffs
      operation: add
    - what: case
      name: _case_standoff_holes
      operation: subtract
