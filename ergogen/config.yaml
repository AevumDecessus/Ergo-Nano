meta:
  engine: 4.1.0
  name: ergo-nano
  version: 0.1
  ref: &kb_ref "Ergo Nano v0.1"
  author: aevumdecessus
  url: &kb_url https://github.com/aevumdecessus/Ergo-Nano
units:
  # Web View Resizing
  $default_width: U
  $default_height: U
  kx: U
  ky: U
  ks: 19 # horizontal space between columns (default: 19)
  kp: 19 # vertical padding between keys (deafult: 19)
  half_kx: 0.5kx
  half_ky: 0.5ky
  # Cutouts
  kcow: 14 #key cutout hole width
  kcoh: 14 #key cutout hole height
  # Keycaps
  keycw: 18 # keycap width (cherry)
  keych: 18 # keycap height (cherry)
  # Padding Variables
  padding: 7
  mcu_padding: 8 # Padding to the right of the MCU for connctors/etc
  px: kx + padding
  py: ky + padding
  half_px: 0.5px
  half_py: 0.5py
  dpx: 2px
  dpy: 2py
  # MCU
  mcu_width: 18.3
  mcu_height: 34.1
  # display
  display_width: 14
  display_height: 36
  display_vert_shift: 4
  # Relative column staggers
  st_outer: 0
  st_pinky: 0
  st_ring: 5
  st_middle: 5
  st_index: -5
  st_inner: -5
  st_innermod: 0
  # pre-evaluate target traces between column staggers
  diode_x: -5
  diode_y: 7 #Negative to place the diode, positive for routing position
  diode_length: 4
  # kicad shifts
  kicad_shift_x: 50
  kicad_shift_y: -125
  # Tolerances
  board_tolerance: 0.3 #Leave this much space around the board in the case
  fillet_radius: 2
  # M3 specific sizes
  m3_hole: 3.2
  m3_heatset_hole: 4.5
  m3_heatset_height: 4
  m3_socket_head_size: 5.5
  # Board sizes inheriting chosen size
  screw_hole: m3_hole
  screw_head: m3_socket_head_size
  heatset_hole: m3_heatset_hole
  heatset_height: m3_heatset_height
  standoff_size: screw_hole + (padding / 2)
  # plate sizes
  pcb_thickness: 1.6
  plate_thickness: 1.5
  top_plate_surface: 5
  gap_pcb_top_plate: top_plate_surface - plate_thickness
  wall_height_switch_plate: heatset_height + pcb_thickness + plate_thickness + gap_pcb_top_plate
  wall_height_pcb: heatset_height + pcb_thickness
  # Extrudes the walls to be level with the top of the PCB
points:
  zones:
    matrix:
      key:
        padding: kp
        tags:
          - key
          - matrix_key
          - switch_diode
      anchor:
        shift: [kicad_shift_x, kicad_shift_y]
      columns:
        outer:
          key:
            column_net: C0
            stagger: st_outer
        pinky:
          key:
            column_net: C1
            stagger: st_pinky
        ring:
          key:
            column_net: C2
            stagger: st_ring
        middle:
          key:
            column_net: C3
            stagger: st_middle
        index:
          key:
            column_net: C4
            stagger: st_index
        inner:
          key:
            column_net: C5
            stagger: st_inner
          rows.mod.skip: true
        innermod:
          key: 
            column_net: C6
            stagger: st_innermod
          rows.mod.skip: true
      rows:
        mod:
          row_net: R4
        bottom:
          row_net: R3
        home:
          row_net: R2
        top:
          row_net: R1
        num:
          row_net: R0
    thumbs:
      key:
        padding: 1kp
        spread: 1ky
        tags:
          - key
          - thumb_cluster
          - switch_diode
      anchor:
        ref: matrix_index_mod
        shift: [half_kx,-1.25ky]
        rotate: -50
      columns:
        t_col0:
          key:
            tags:
              - key_2u_vert
            column_net: C7
            height: 2ky
            shift: [0, half_ky]
          rows.far.skip: true
          rows.near.row_net: R0
        t_col1:
          key:
            column_net: C7
          rows.near.row_net: R4
          rows.far.row_net: R1
        t_col2:
          key:
            column_net: C7
          rows.near.row_net: R3
          rows.far.row_net: R2
      rows:
        near:
        far:
    encoder_mcu:
      columns:
        encoder:
          key:
            column_net: C6
            tags:
              - encoder
          rows.encoder.row_net: R4
      anchor:
        ref: matrix_innermod_bottom
        shift: [1.25kx, 0.65ky]
        rotate: 40
    screw_top_left:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_outer_num
        shift: [half_kx, -half_ky]
    screw_top_center:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_index_num
        shift: [half_kx, half_ky]
    screw_top_right:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_innermod_num
        shift: [half_kx, -half_ky]
    screw_bottom_left:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_outer_mod
        shift: [half_kx, half_ky]
    screw_center:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_index_mod
        shift: [half_kx, -half_ky]
    screw_center_bottom:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_ring_mod
        shift: [half_kx, -half_ky]
    screw_thumbs_right_center:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: thumbs_t_col2_near
        shift: [-half_kx, half_ky]
    screw_bottom_right:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_innermod_bottom
        shift: [half_kx, half_ky]
    mcu_top_left:
      key.tags:
        - helper
        - mcu
      anchor:
        - ref: matrix_innermod_num
          shift: [0.75kx,6]
    mcu_top_right:
      key.tags:
        - helper
        - mcu
      anchor:
        - ref: mcu_top_left
          shift: [mcu_width,0]
    mcu_bottom_right:
      key.tags:
        - helper
        - mcu
      anchor:
        - ref: mcu_top_right
          shift: [0,-mcu_height]
    mcu_bottom_left:
      key.tags:
        - helper
        - mcu
      anchor:
        - ref: mcu_top_left
          shift: [0,-mcu_height]
    display_bottom_left:
      key.tags:
        - helper
        - display
      anchor:
        - ref: mcu_bottom_left
          shift: [mcu_width / 2 - display_width / 2, -display_vert_shift]
    display_bottom_right:
      key.tags:
        - helper
        - display
      anchor:
        - ref: display_bottom_left
          shift: [display_width, 0]
    display_top_left:
      key.tags:
        - helper
        - display
      anchor:
        - ref: display_bottom_left
          shift: [0, display_height]
    display_top_right:
      key.tags:
        - helper
        - display
      anchor:
        - ref:  display_bottom_left
          shift: [display_width, display_height]
    screw_mcu_bottom_right:
      key.tags:
        - helper
        - screws_expand
      anchor:
        - ref: mcu_bottom_right
          shift: [1, -8]
outlines:
  _matrix_outline: #Outline around all keys only with half a key of padding around
    - what: polygon
      operation: stack
      points:
        - ref: matrix_outer_num
          shift: [-half_px,half_py]
        - ref: matrix_ring_num
          shift: [-half_px,half_py]
        - ref: matrix_middle_num
          shift: [-half_px,half_py]
        - ref: matrix_middle_num
          shift: [half_px,half_py]
        - ref: matrix_innermod_num
          shift: [half_px,half_py]
        - ref: matrix_innermod_bottom
          shift: [half_px,-half_py]
        - ref: thumbs_t_col2_far
          shift: [half_px,half_py]
        - ref: thumbs_t_col2_near
          shift: [half_px,-half_py]
        - ref: thumbs_t_col1_near
          shift: [-half_px,-half_py]
        - ref: matrix_index_mod
          shift: [-half_px,-half_py]
        - ref: matrix_ring_mod
          shift: [half_px, -half_py]
        - ref: matrix_pinky_mod
          shift: [half_px, -half_py]
        - ref: matrix_outer_mod
          shift: [-half_px,-half_py]
      fillet: fillet_radius
  _mcu_outline: # Outline around the MCU, angled at the botom to merge more cleanly with the matrix
    - what: polygon
      operation: stack
      points:
        - ref: mcu_top_left
          shift: [-padding, padding]
        - ref: mcu_top_right # bottom right space for the MCU
          shift: [mcu_padding, padding]
        - ref: mcu_bottom_right
          shift: [mcu_padding, -2padding]
        - ref: mcu_bottom_left
          shift: [-padding, -6padding]
      fillet: fillet_radius
  _mcu_tight: # Exact size of the MCU, used to show it's position on the combo dxf
    - what: polygon
      operation: stack
      points:
        - mcu_top_left
        - mcu_top_right
        - mcu_bottom_right
        - mcu_bottom_left
  _mcu_tolerance: # The MCU board with a tolerance gap - Used if we want to extend the switch plate to cover the whole PCB
    - what: outline
      name: _mcu_tight
      expand: board_tolerance
      fillet: fillet_radius
  _display_tight:
    - what: polygon
      operation: stack
      points:
        - display_bottom_left
        - display_bottom_right
        - display_top_right
        - display_top_left
  ## PCB ##
  _pcb_outline: # Merged matrix and MCU outline to form the PCB shape
    - what: outline
      name: _mcu_outline
    - what: outline
      name: _matrix_outline
      operation: add
      fillet: fillet_radius
  ## Standoffs and screws ##
  _standoffs: # The circles for each screw showing standoff size
    - what: circle
      radius: standoff_size / 2
      where: /screw/
  _standoff_holes: # The heaset holes themselves for the bottom case
    - what: circle
      radius: heatset_hole / 2
      where: /screw/
  _screw_holes: # screw_holes for the bottom plate if not using a case
    - what: circle
      radius: screw_hole / 2
      where: /screw/
  _screw_heads:
    - what: circle
      radius: screw_head / 2
      where: /screw/
  ## Switch Plate ##
  _switch_cutouts: # Switch cutouts to form the switch plate
    - what: rectangle
      fillet: fillet_radius
      where: /key/
      size: [kcow, kcoh]
    - what: rectangle
      fillet: fillet_radius
      where: /encoder/
      size: [kcow, kcoh]
  _switchplate_base:
    - what: outline
      name: _matrix_outline
    - what: outline
      name: _switch_cutouts
      operation: subtract
  switchplate:
    - what: outline
      name: _switchplate_base
    - what: outline
      name: _screw_holes
      operation: subtract
  ## Back Plate
  _backplate_base:
    - what: outline
      name: _pcb_outline
  backplate:
    - what: outline
      name: _backplate_base
    - what: outline
      name: _screw_holes
      operation: subtract
  ## Keycaps
  _keycap_outlines:
    - what: rectangle
      fillet: fillet_radius
      where: [key]
      size: [keycw, keych]
    - what: rectangle
      fillet: fillet_radius
      where: [key_2u_vert]
      size: [keycw, 2keych]
    - what: rectangle
      fillet: fillet_radius
      where: [encoder]
      size: [keycw, keych]
  ## Case Wall ##
  _outer_wall: # 0.5 padding bigger than board - forms the outer wall of the case
    - what: outline
      name: _pcb_outline
      expand: 0.5padding
  _inner_wall: # Tolerance gap around the whole PCB, forms the inner wall of the case
    - what: outline
      name: _pcb_outline
      expand: board_tolerance
  _case_wall: # A wall from the inner and outer walls defined above
    - name: _outer_wall
    - operation: subtract
      name: _inner_wall
  preview: # Preview output of most of the major elements
    - name: _outer_wall
      operation: stack
    - name: _inner_wall
      operation: stack
    - name: _pcb_outline
      operation: stack
    - name: _mcu_tight
      operation: stack
    - name: _display_tight
      operation: stack
    - name: _switch_cutouts
      operation: stack
    - name: _keycap_outlines
      operation: stack
    - name: _standoff_holes
      operation: stack
pcbs:
  backplate:
    template: kicad8
    outlines:
      main:
        outline: _backplate_base
    footprints:
      ## Screw Holes ##
      board_mounting_holes:
        what: ceoloide/mounting_hole_npth
        where: /screws/
        params:
          hole_size: screw_hole
          hole_drill: screw_hole
          designator: 'MH'
  switchplate:
    template: kicad8
    outlines:
      main:
        outline: _switchplate_base
    footprints:
      ## Screw Holes ##
      board_mounting_holes:
        what: ceoloide/mounting_hole_npth
        where: /^screws$/ #Don't try to cut the screws_expand holes
        params:
          hole_size: screw_hole
          hole_drill: screw_hole
          designator: 'MH'
  ergonano:
    template: kicad8
    outlines:
      main:
        outline: _pcb_outline
    footprints:
      mx:
        what: ceoloide/switch_mx
        where: /key/
        params:
          hotswap: true
          hotswap_pads_same_side: true
          reversible: true
          include_silkscreen: true
          include_corner_marks: true
          include_keycap: false
          include_plated_holes: true
          outer_pad_width_front: 2
          outer_pad_width_back: 2
          outer_pad_height: 2
          keycap_width: keycw
          keycap_height: keych
          locked_traces_vias: false
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: ceoloide/diode_tht_sod123
        where: [switch_diode]
        params:
          reversible: true
          include_tht: true
          include_traces_vias: true
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [diode_x, -diode_y]
          rotate: 90
      nice-nano:
        what: ceoloide/mcu_nice_nano
        params:
          reverse_mount: true
          reversible: true
          P0: E1
          P1: CS
          P2: MOS
          P3: SCK
          P4: E2
          P5: R0
          P6: R1
          P7: R2
          P8: R3
          P9: R4
          P21: C0
          P20: C1
          P19: C2
          P18: C3
          P15: C4
          P14: C5
          P16: C6
          P10: C7
          RST: RS
        where:
          ref: mcu_top_left
          shift: [(mcu_width / 2), -(mcu_height / 2)]
      nice-view:
        what: ceoloide/display_nice_view
        where:
          ref: display_bottom_left
          shift: [display_width / 2, display_height / 2]
        params:
          reversible: true
      battery_jst:
        what: ceoloide/battery_connector_jst_ph_2
        where:
          ref: mcu_top_right
          ## Shift slightly right of "center" in order to actually center it with the rotation
          shift: [(mcu_padding / 2) , -8]
          rotate: 180
        params:
          reversible: true
          include_traces: true
      ## Power and Reset Switches ##
      power_switch:
        what: ceoloide/power_switch_smd_side
        where:
          ref: mcu_bottom_right
          shift: [(mcu_padding / 2), kx]
        params:
          reversible: true
          include_courtyard: true
          from: BAT_P
          to: VCC
      reset_switch:
        what: ceoloide/reset_switch_tht_top
        where:
          ref: mcu_bottom_right
          shift: [mcu_padding / 2 , 0]
          rotate: 90
        params:
          reversible: true
          from: GND
          to: RS
      ## Rotary Encoder
      rotary_encoder:
        what: ceoloide/rotary_encoder_ec11_ec12
        where: [encoder]
        adjust:
          rotate: 180
        params:
          reversible: true
          include_silkscreen: true
          include_plated_mounting_holes: false
          include_plate_hole_marking: false
          mounting_holes_height: 2.8
          mounting_holes_width: 1.5
          S1: "{{column_net}}"
          S2: "{{colrow}}"
          A: E1
          C: E2
      encoder_diode:
        what: ceoloide/diode_tht_sod123
        where: [encoder]
        params:
          reversible: true
          include_tht: true
          include_traces_vias: true
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, 0]
          rotate: 270
      encoder_diode_route:
        what: ceoloide/utility_router
        where: [encoder]
        params:
          net: "{{col_net}}"
          route: "b(-2.5,7)(0,4)"
          locked: false
      ## Silkscreen Text ##
      board_name:
        what: ceoloide/utility_text
        where:
          ref: matrix_outer_num
          shift: [0.5kx, 0.6ky]
        params:
          reversible: true
          bold: true
          height: 3
          width: 3
          text: "Ergo-Nano"
      board_version:
        what: ceoloide/utility_text
        where:
          ref: matrix_ring_num
          shift: [0, 0.5ky]
        params:
          reversible: true
          bold: true
          height: 3
          width: 3
          text: "V0.1"
      author:
        what: ceoloide/utility_text
        where:
          ref: matrix_outer_num
          shift: [0.6kx, 0.4ky]
        params:
          reversible: true
          bold: false
          height: 1
          width: 1
          text: "by Aevum Decessus"
      left_hand:
        what: ceoloide/utility_text
        where:
          ref: [matrix_inner_num]
          shift: [0.25kx, 0.5ky]
        params:
          side: F
          mirrored: false
          bold: true
          height: 3
          width: 3
          text: Left Hand
      right_hand:
        what: ceoloide/utility_text
        where:
          ref: [matrix_inner_num]
          shift: [0.25kx, 0.5ky]
        params:
          side: B
          mirrored: true
          bold: true
          height: 3
          width: 3
          text: Right Hand
      battery_connector_text:
        what: ceoloide/utility_text
        where:
          ref: mcu_top_left
          shift: [mcu_width / 2, mcu_padding / 2]
        params:
          reversible: true
          height: 1
          width: 1
          text: mount battery connector\ntop side if under mcu\nbottom side if larger
      switch_column_label:
        what: ceoloide/utility_text
        where: /^key/
        adjust:
          shift: [-3, -11]
        params:
          reversible: true
          text: "{{row_net}}"
      switch_row_label:
        what: ceoloide/utility_text
        where: /^key/
        adjust:
          shift: [8.5,4.5]
        params:
          reversible: true
          text: "{{column_net}}"
      switch_name_label:
        what: ceoloide/utility_text
        where: /^key/
        adjust: 
          shift: [3,-4]
        params:
          reversible: true
          text: "{{colrow}}"
      ## Screw Holes ##
      board_mounting_holes:
        what: ceoloide/mounting_hole_npth
        where: /screw/
        params:
          hole_size: screw_hole
          hole_drill: screw_hole
          designator: 'MH'
      ## Static trace routes ##
      key_diode_routes:
        what: ceoloide/utility_router
        where: /key/
        params:
          net: "{{colrow}}"
          route: "f(-7,-4)(-7,-3)(-7,1)(-5,3)"
          locked: false
      col_routes:
        what: ceoloide/utility_router
        where: /^matrix_.*_(?!num)/
        params:
          net: "{{col_net}}"
          route: "b(6,-6)(6,-17)(7,-18)(7,-24)"
          locked: false
      thumb_col_routes:
        what: ceoloide/utility_router
        where: /^thumbs_(?!t_col0).*_near/
        params:
          net: "{{col_net}}"
          route: "b(6,-6)(6,-17)(7,-18)(7,-24)"
          locked: false
cases:
  _xl_bottom:
    - name: _outer_wall
      extrude: plate_thickness
  _pcb_bottom:
    - name: _pcb_outline
      extrude: plate_thickness
  _wall_switch_plate:
    - name: _case_wall
      extrude: wall_height_switch_plate
  _wall_pcb:
    - name: _case_wall
      extrude: wall_height_pcb
  _case_standoffs:
    - name: _standoffs
      extrude: heatset_height
  _case_standoff_holes:
    - name: _standoff_holes
      extrude: heatset_height
  _pcb_plate_holes:
    - name: _screw_holes
      extrude: plate_thickness
  _case_bottom: # The bottom surface of the case with standoffs
    - what: case
      name: _xl_bottom
      operation: add
    - what: case
      name: _case_standoffs
      operation: add
    - what: case
      name: _case_standoff_holes
      operation: subtract
  bottom_plate: # Bottom plate with screw holes instead of a full case
    - what: case
      name: _pcb_bottom
      operation: add
    - what: case
      name: _pcb_plate_holes
      operation: subtract
  bottom_case_switch: # Case with walls to the surface of the switch plate
    - what: case
      name: _case_bottom
      operation: add
    - what: case
      name: _wall_switch_plate
      operation: add
  bottom_case_pcb: # Case with walls to the surface of the PCB
    - what: case
      name: _case_bottom
      operation: add
    - what: case
      name: _wall_pcb
      operation: add