meta:
  engine: 4.1.0
units:
  # Web View Resizing
  $default_width: U
  $default_height: U
  # Proxy Spacing Variables
  kx: U
  ky: U
  # Padding Variables
  padding: 10
  px: kx + padding
  py: ky + padding
  half_x: 0.5px
  half_y: 0.5py
  # Mounting holes
  m2: 2.2
  m3: 3.2
  m3_heatset: 4
points:
  zones:
    matrix:
      anchor:
        shift: [50, -125]
      columns:
        outer:
          key:
            column_net: COL0
        pinky:
          key:
            column_net: COL1
        ring:
          key:
            column_net: COL2
            stagger: 5
        middle:
          key:
            column_net: COL3
            stagger: 5
        index:
          key:
            column_net: COL4
            stagger: -5
          rows.mod.skip: true
        inner:
          key:
            column_net: COL5
            stagger: -5
          rows.mod.skip: true
      rows:
        mod:
          row_net: ROW4
        bottom:
          row_net: ROW3
        home:
          row_net: ROW2
        top:
          row_net: ROW1
        num:
          row_net: ROW0
    thumbs:
      key:
        padding: 1kx
        spread: 1ky
      anchor:
        ref: matrix_middle_mod
        shift: [0.5kx,-1.5ky]
        rotate: -50
      columns:
        top:
          key:
            column_net: COL6
            height: 2ky
            shift: [0, 0.5ky]
          rows.far.skip: true
          rows.near.row_net: ROW0
        middle:
          key:
            column_net: COL6
          rows.near.row_net: ROW4
          rows.far.row_net: ROW1
        bottom:
          key:
            column_net: COL6
          rows.near.row_net: ROW3
          rows.far.row_net: ROW2
      rows:
        near:
        far:
outlines:
  board:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_outer_num
          shift: [-half_x,half_y]
        - ref: matrix_ring_num
          shift: [-half_x,half_y]
        - ref: matrix_middle_num
          shift: [-half_x,half_y]
        - ref: matrix_middle_num
          shift: [half_x,half_y]
        - ref: matrix_inner_num
          shift: [half_x,half_y]
        - ref: matrix_inner_num # top right space for the MCU
          shift: [1.25px, half_y]
        - ref: matrix_inner_top # bottom right space for the MCU
          shift: [1.25px, -half_y]
        - ref: matrix_inner_bottom
          shift: [half_x,-half_y]
        - ref: thumbs_middle_far
          shift: [half_x,half_y]
        - ref: thumbs_bottom_far
          shift: [half_x,half_y]
        - ref: thumbs_bottom_near
          shift: [half_x,-half_y]
        - ref: thumbs_middle_near
          shift: [-half_x,-half_y]
        - ref: matrix_ring_mod
          shift: [half_x,-half_y]
        - ref: matrix_pinky_mod
          shift: [half_x, -half_y]
        - ref: matrix_outer_mod
          shift: [-half_x,-half_y]
      fillet: 5
  keys:
    - what: rectangle
      where: true
      size: [kx-0.5, ky-0.5]
  combo:
    - name: board
    - operation: subtract
      name: keys
pcbs:
  board:
    template: kicad8
    outlines:
      main:
        outline: board
    footprints:
      mx:
        what: ceoloide/switch_mx
        where: true
        params:
          hotswap: true
          hotswap_pads_same_side: true
          reversible: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: ceoloide/diode_tht_sod123
        where: true
        params:
          reversible: true
          include_tht: true
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [-7, -5]
          rotate: 90
      nice-nano:
        what: ceoloide/mcu_nice_nano
        params:
          reverse_mount: true
          reversible: true
          P1: CS
          P2: MOSI
          P3: SCK
          P5: ROW0
          P6: ROW1
          P7: ROW2
          P8: ROW3
          P9: ROW4
          P20: COL0
          P19: COL1
          P18: COL2
          P15: COL3
          P14: COL4
          P16: COL5
          P10: COL6
        where:
          ref: matrix_inner_top
          shift: [1.25kx,0.5ky]
      nice-view:
        what: ceoloide/display_nice_view
        where:
          ref: matrix_inner_top
          shift: [1.25kx,0.25ky]
        params:
          reversible: true
      top_left_mount:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_outer_num]
          shift: [-0.5kx, 0.5ky]
        params:
          hole_size: m3
          hole_drill: m3
          designator: 'MH'
      top_center_mount:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_middle_num]
          shift: [0, 0.5ky]
        params:
          hole_size: m3
          hole_drill: m3
          designator: 'MH'
      top_right_mount:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_inner_num]
          shift: [0.5kx, 0.5ky]
        params:
          hole_size: m3
          hole_drill: m3
          designator: 'MH'
      bottom_left_mount:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_outer_mod]
          shift: [-0.6kx, -0.5ky]
        params:
          hole_size: m3
          hole_drill: m3
          designator: 'MH'
      center_bottom_mount:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_middle_mod]
          shift: [0.5kx, -0.5ky]
        params:
          hole_size: m3
          hole_drill: m3
          designator: 'MH'
      thumbs_right_bottom_mount:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [thumbs_bottom_near]
          shift: [0.5kx, -0.5ky]
        params:
          hole_size: m3
          hole_drill: m3
          designator: 'MH'
      thumbs_right_top_mount:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [thumbs_bottom_far]
          shift: [0.5kx, 0.5ky]
        params:
          hole_size: m3
          hole_drill: m3
          designator: 'MH'
      bottom_right_mount:
        what: ceoloide/mounting_hole_npth
        where:
          ref: [matrix_inner_bottom]
          shift: [0.5kx, -0.5ky]
        params:
          hole_size: m3
          hole_drill: m3
          designator: 'MH'
cases:
