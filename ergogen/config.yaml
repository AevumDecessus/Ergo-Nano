meta:
  engine: 4.1.0
units:
  # Web View Resizing
  $default_width: U
  $default_height: U
  # Proxy Spacing Variables
  kx: U
  ky: U
  half_kx: 0.5kx
  half_ky: 0.5ky
  # Padding Variables
  padding: 5
  px: kx + padding
  py: ky + padding
  half_px: 0.5px
  half_py: 0.5py
  dpx: 2px
  dpy: 2py
  # Tolerances
  board_tolerance: 0.1 #Leave this much space around the board in the case
  # Mounting holes
  m2: 2.2
  m3: 3.2
  m3_heatset: 4.5
  m3_heatset_height: 4
  # plate sizes
  plate_thickness: 1.6
  wall_height: m3_heatset_height
  # Total height, not added to plate_thickness
points:
  zones:
    matrix:
      anchor:
        shift: [50, -125]
      columns:
        outer:
          key:
            column_net: COL0
        pinky:
          key:
            column_net: COL1
        ring:
          key:
            column_net: COL2
            stagger: 5
        middle:
          key:
            column_net: COL3
            stagger: 5
        index:
          key:
            column_net: COL4
            stagger: -5
          rows.mod.skip: true
        inner:
          key:
            column_net: COL5
            stagger: -5
          rows.mod.skip: true
      rows:
        mod:
          row_net: ROW4
        bottom:
          row_net: ROW3
        home:
          row_net: ROW2
        top:
          row_net: ROW1
        num:
          row_net: ROW0
    thumbs:
      key:
        padding: 1kx
        spread: 1ky
      anchor:
        ref: matrix_middle_mod
        shift: [half_kx,-1.5ky]
        rotate: -50
      columns:
        top:
          key:
            column_net: COL6
            height: 2ky
            shift: [0, half_ky]
          rows.far.skip: true
          rows.near.row_net: ROW0
        middle:
          key:
            column_net: COL6
          rows.near.row_net: ROW4
          rows.far.row_net: ROW1
        bottom:
          key:
            column_net: COL6
          rows.near.row_net: ROW3
          rows.far.row_net: ROW2
      rows:
        near:
        far:
    mount_top_left:
      key:
        height: 0
        width: 0
      anchor:
        ref: matrix_outer_num
        shift: [half_kx, -half_ky]
    mount_top_center:
      key:
        height: 0
        width: 0
      anchor:
        ref: matrix_middle_num
        shift: [-half_kx, -half_ky]
    mount_top_right:
      key:
        height: 0
        width: 0
      anchor:
        ref: matrix_inner_num
        shift: [half_kx, -half_ky]
    mount_bottom_left:
      key:
        height: 0
        width: 0
      anchor:
        ref: matrix_outer_mod
        shift: [half_kx, half_ky]
    mount_center_bottom:
      key:
        height: 0
        width: 0
      anchor:
        ref: matrix_middle_mod
        shift: [half_kx, -half_ky]
    mount_thumbs_right_center:
      key:
        height: 0
        width: 0
      anchor:
        ref: thumbs_bottom_near
        shift: [-half_kx, half_ky]
    mount_bottom_right:
      key:
        height: 0
        width: 0
      anchor:
        ref: matrix_inner_bottom
        shift: [half_kx, half_ky]
outlines:
  board:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_outer_num
          shift: [-half_px,half_py]
        - ref: matrix_ring_num
          shift: [-half_px,half_py]
        - ref: matrix_middle_num
          shift: [-half_px,half_py]
        - ref: matrix_middle_num
          shift: [half_px,half_py]
        - ref: matrix_inner_num
          shift: [half_px,half_py]
        - ref: matrix_inner_num # top right space for the MCU
          shift: [1.25px, half_py]
        - ref: matrix_inner_top # bottom right space for the MCU
          shift: [1.25px, -half_py]
        - ref: matrix_inner_bottom
          shift: [half_px,-half_py]
        - ref: thumbs_middle_far
          shift: [half_px,half_py]
        - ref: thumbs_bottom_far
          shift: [half_px,half_py]
        - ref: thumbs_bottom_near
          shift: [half_px,-half_py]
        - ref: thumbs_middle_near
          shift: [-half_px,-half_py]
        - ref: matrix_ring_mod
          shift: [half_px,-half_py]
        - ref: matrix_pinky_mod
          shift: [half_px, -half_py]
        - ref: matrix_outer_mod
          shift: [-half_px,-half_py]
      fillet: 5
  _board_with_border: # 0.5 padding bigger than board
    - what: outline
      name: board
      expand: 0.5padding
  _board_tolerance:
    - what: outline
      name: board
      expand: board_tolerance
  _board_wall: # a wall of only 0.5 padding bigger than the board
    - name: _board_with_border
    - operation: subtract
      name: _board_tolerance
  keys:
    - what: rectangle
      where: /^(matrix|thumbs)_/
      size: [kx-0.5, ky-0.5]
  combo:
    - name: board
    - operation: subtract
      name: keys
pcbs:
  board:
    template: kicad8
    outlines:
      main:
        outline: board
    footprints:
      mx:
        what: ceoloide/switch_mx
        where: /^(matrix|thumbs)_/
        params:
          hotswap: true
          hotswap_pads_same_side: true
          reversible: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: ceoloide/diode_tht_sod123
        where: /^(matrix|thumbs)_/
        params:
          reversible: true
          include_tht: true
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [-6, -7]
          rotate: 90
      nice-nano:
        what: ceoloide/mcu_nice_nano
        params:
          reverse_mount: true
          reversible: true
          P1: CS
          P2: MOSI
          P3: SCK
          P5: ROW0
          P6: ROW1
          P7: ROW2
          P8: ROW3
          P9: ROW4
          P20: COL0
          P19: COL1
          P18: COL2
          P15: COL3
          P14: COL4
          P16: COL5
          P10: COL6
        where:
          ref: matrix_inner_top
          shift: [1.25kx,half_ky]
      nice-view:
        what: ceoloide/display_nice_view
        where:
          ref: matrix_inner_top
          shift: [1.25kx,0.25ky]
        params:
          reversible: true
      board_mounting_holes:
        what: ceoloide/mounting_hole_npth
        where: /^mount_/
        params:
          hole_size: m3
          hole_drill: m3
          designator: 'MH'
cases:
  _xl_bottom:
    - name: _board_with_border
      extrude: plate_thickness
  _wall:
    - name: _board_wall
      extrude: wall_height
  case:
    - what: case
      name: _xl_bottom
      operation: add
    - what: case
      name: _wall
      operation: add
