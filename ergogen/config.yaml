meta:
  engine: 4.1.0
units:
  # Web View Resizing
  $default_width: U
  $default_height: U
  # Proxy Spacing Variables
  kx: U
  ky: U
  half_kx: 0.5kx
  half_ky: 0.5ky
  # Padding Variables
  padding: 7
  px: kx + padding
  py: ky + padding
  half_px: 0.5px
  half_py: 0.5py
  dpx: 2px
  dpy: 2py
  # Tolerances
  board_tolerance: 0.1 #Leave this much space around the board in the case
  # Mounting holes
  m2: 2.2
  m3: 3.2
  m3_heatset_hole: 4.5
  m3_heatset_height: 4
  standoff_size: m3_heatset_hole + (padding / 2)
  # plate sizes
  plate_thickness: 1.6
  wall_height: m3_heatset_height + plate_thickness
  # Extrudes the walls to be level with the top of the PCB
points:
  zones:
    matrix:
      anchor:
        shift: [50, -125]
      columns:
        outer:
          key:
            column_net: CL0
        pinky:
          key:
            column_net: CL1
        ring:
          key:
            column_net: CL2
            stagger: 5
        middle:
          key:
            column_net: CL3
            stagger: 5
        index:
          key:
            column_net: CL4
            stagger: -5
        inner:
          key:
            column_net: CL5
            stagger: -5
          rows.mod.skip: true
        innermod:
          key: 
            column_net: CL6
          rows.mod.skip: true
      rows:
        mod:
          row_net: RW4
        bottom:
          row_net: RW3
        home:
          row_net: RW2
        top:
          row_net: RW1
        num:
          row_net: RW0
    thumbs:
      key:
        padding: 1kx
        spread: 1ky
      anchor:
        ref: matrix_index_mod
        shift: [half_kx,-1.25ky]
        rotate: -50
      columns:
        t_col0:
          key:
            column_net: CL7
            height: 2ky
            shift: [0, half_ky]
          rows.far.skip: true
          rows.near.row_net: RW0
        t_col1:
          key:
            column_net: CL7
          rows.near.row_net: RW4
          rows.far.row_net: RW1
        t_col2:
          key:
            column_net: CL7
          rows.near.row_net: RW3
          rows.far.row_net: RW2
      rows:
        near:
        far:
    mount_top_left:
      key:
        height: 0
        width: 0
      anchor:
        ref: matrix_outer_num
        shift: [half_kx, -half_ky]
    mount_top_center:
      key:
        height: 0
        width: 0
      anchor:
        ref: matrix_middle_num
        shift: [half_kx, -half_ky]
    mount_top_right:
      key:
        height: 0
        width: 0
      anchor:
        ref: matrix_innermod_num
        shift: [0.75kx, -half_ky]
    mount_bottom_left:
      key:
        height: 0
        width: 0
      anchor:
        ref: matrix_outer_mod
        shift: [half_kx, half_ky]
    mount_center:
      key:
        height: 0
        width: 0
      anchor:
        ref: matrix_middle_home
        shift: [half_kx, -half_ky]
    mount_center_bottom:
      key:
        height: 0
        width: 0
      anchor:
        ref: matrix_middle_mod
        shift: [half_kx, -half_ky]
    mount_thumbs_right_center:
      key:
        height: 0
        width: 0
      anchor:
        ref: thumbs_t_col2_near
        shift: [-half_kx, half_ky]
    mount_bottom_right:
      key:
        height: 0
        width: 0
      anchor:
        ref: matrix_innermod_bottom
        shift: [half_kx, half_ky]
outlines:
  board:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_outer_num
          shift: [-half_px,half_py]
        - ref: matrix_ring_num
          shift: [-half_px,half_py]
        - ref: matrix_middle_num
          shift: [-half_px,half_py]
        - ref: matrix_middle_num
          shift: [half_px,half_py]
        - ref: matrix_innermod_num
          shift: [half_px,half_py]
        - ref: matrix_innermod_num # top right space for the MCU
          shift: [2.25kx, half_py]
        - ref: matrix_innermod_top # bottom right space for the MCU
          shift: [2.25kx, -half_py]
        - ref: matrix_innermod_bottom
          shift: [half_px,-half_py]
        - ref: thumbs_t_col1_far
          shift: [-half_px,half_py]
        - ref: thumbs_t_col2_far
          shift: [half_px,half_py]
        - ref: thumbs_t_col2_near
          shift: [half_px,-half_py]
        - ref: thumbs_t_col1_near
          shift: [-half_px,-half_py]
        - ref: matrix_index_mod
          shift: [-half_px,-half_py]
        - ref: matrix_ring_mod
          shift: [half_px, -half_py]
        - ref: matrix_pinky_mod
          shift: [half_px, -half_py]
        - ref: matrix_outer_mod
          shift: [-half_px,-half_py]
      fillet: 5
  _board_with_border: # 0.5 padding bigger than board
    - what: outline
      name: board
      expand: 0.5padding
  _board_tolerance:
    - what: outline
      name: board
      expand: board_tolerance
  _board_wall: # a wall of only 0.5 padding bigger than the board
    - name: _board_with_border
    - operation: subtract
      name: _board_tolerance
  _standoffs:
    - what: circle
      radius: standoff_size / 2
      where: /^mount_/
  _standoff_holes:
    - what: circle
      radius: m3_heatset_hole / 2
      where: /^mount_/
  keys:
    - what: rectangle
      where: /^(matrix|thumbs)_/
      size: [kx-0.5, ky-0.5]
  combo:
    - name: board
    - operation: subtract
      name: keys
pcbs:
  board:
    template: kicad8
    outlines:
      main:
        outline: board
    footprints:
      mx:
        what: ceoloide/switch_mx
        where: /^(matrix|thumbs)_/
        params:
          hotswap: true
          hotswap_pads_same_side: true
          reversible: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: ceoloide/diode_tht_sod123
        where: /^(matrix|thumbs)_/
        params:
          reversible: true
          include_tht: true
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [-6, -7]
          rotate: 90
      nice-nano:
        what: ceoloide/mcu_nice_nano
        params:
          reverse_mount: true
          reversible: true
          P1: CS
          P2: MOS
          P3: SCK
          P5: RW0
          P6: RW1
          P7: RW2
          P8: RW3
          P9: RW4
          P21: CL0
          P20: CL1
          P19: CL2
          P18: CL3
          P15: CL4
          P14: CL5
          P16: CL6
          P10: CL7
        where:
          ref: matrix_innermod_top
          shift: [1.5kx,half_ky]
      nice-view:
        what: ceoloide/display_nice_view
        where:
          ref: matrix_innermod_top
          shift: [1.5kx,0.25ky]
        params:
          reversible: true
      battery_jst:
        what: ceoloide/battery_connector_jst_ph_2
        where:
          ref: matrix_innermod_num
          shift: [0.75kx,-0.25ky]
          rotate: 180
        params:
          reversible: true
          include_traces: true
      power_switch:
        what: ceoloide/power_switch_smd_side
        where:
          ref: matrix_innermod_num
          shift: [0.75kx,0.4py]
          rotate: 90
        params:
          reversible: true
          from: BAT_P
          to: VCC
      reset_switch:
        what: ceoloide/reset_switch_tht_top
        where:
          ref: matrix_innermod_top
          shift: [0.75kx, 0]
          rotate: 90
        params:
          reversible: true
      board_mounting_holes:
        what: ceoloide/mounting_hole_npth
        where: /^mount_/
        params:
          hole_size: m3
          hole_drill: m3
          designator: 'MH'
      key_diode_routes:
        what: ceoloide/utility_router
        where: /^(matrix|thumbs)_/
        params:
          net: "{{colrow}}"
          route: "f(-7.75,-5)(-9,-5)(-9,-1)(-6,3)"
      col_routes:
        what: ceoloide/utility_router
        where: /^matrix_.*_(?!num)/
        params:
          net: "{{col_net}}"
          route: "b(7.75,-5)(7.75,-7)(7,-7)(7,-20)(7.75,-20)(7.75,-24)"
cases:
  _xl_bottom:
    - name: _board_with_border
      extrude: plate_thickness
  _wall:
    - name: _board_wall
      extrude: wall_height
  _case_standoffs:
    - name: _standoffs
      extrude: m3_heatset_height
  _case_standoff_holes:
    - name: _standoff_holes
      extrude: m3_heatset_height
  case:
    - what: case
      name: _xl_bottom
      operation: add
    - what: case
      name: _wall
      operation: add
    - what: case
      name: _case_standoffs
      operation: add
    - what: case
      name: _case_standoff_holes
      operation: subtract