meta:
  engine: 4.1.0
  name: ergo-nano
  version: 0.1
  ref: &kb_ref "Ergo Nano v0.1"
  author: aevumdecessus
  url: &kb_url https://github.com/aevumdecessus/Ergo-Nano
units:
  # Web View Resizing
  $default_width: U
  $default_height: U
  kx: U
  ky: U
  ks: 19 # horizontal space between columns (default: 19)
  kp: 19 # vertical padding between keys (deafult: 19)
  half_kx: 0.5kx
  half_ky: 0.5ky
  kcow: 14 #key cutout hole width
  kcoh: 14 #key cutout hole height
  # Padding Variables
  padding: 7
  px: kx + padding
  py: ky + padding
  half_px: 0.5px
  half_py: 0.5py
  dpx: 2px
  dpy: 2py
  # MCU
  mcu_width: 18.3
  mcu_height: 34.1
  # Relative column staggers
  st_outer: 0
  st_pinky: 0
  st_ring: 5
  st_middle: 5
  st_index: -5
  st_inner: -5
  st_innermod: 0
  # pre-evaluate target traces between column staggers
  diode_x: -5
  diode_y: 7 #Negative to place the diode, positive for routing position
  diode_length: 4
  # kicad shifts
  kicad_shift_x: 50
  kicad_shift_y: -125
  # Tolerances
  board_tolerance: 0.3 #Leave this much space around the board in the case
  # M3 specific sizes
  m3_hole: 3.2
  m3_heatset_hole: 4.5
  m3_heatset_height: 4
  m3_socket_head_size: 5.5
  # Board sizes inheriting chosen size
  screw_hole: m3_hole
  screw_head: m3_socket_head_size
  heatset_hole: m3_heatset_hole
  heatset_height: m3_heatset_height
  standoff_size: screw_hole + (padding / 2)
  # plate sizes
  pcb_thickness: 1.6
  plate_thickness: 1.5
  top_plate_surface: 5
  gap_pcb_top_plate: top_plate_surface - plate_thickness
  wall_height_switch_plate: heatset_height + pcb_thickness + plate_thickness + gap_pcb_top_plate
  wall_height_pcb: heatset_height + pcb_thickness
  # Extrudes the walls to be level with the top of the PCB
points:
  zones:
    matrix:
      key:
        padding: kp
        tags:
          - key
          - matrix_key
      anchor:
        shift: [kicad_shift_x, kicad_shift_y]
      columns:
        outer:
          key:
            column_net: CL0
            stagger: st_outer
        pinky:
          key:
            column_net: CL1
            stagger: st_pinky
        ring:
          key:
            column_net: CL2
            stagger: st_ring
        middle:
          key:
            column_net: CL3
            stagger: st_middle
        index:
          key:
            column_net: CL4
            stagger: st_index
        inner:
          key:
            column_net: CL5
            stagger: st_inner
          rows.mod.skip: true
        innermod:
          key: 
            column_net: CL6
            stagger: st_innermod
          rows.mod.skip: true
      rows:
        mod:
          row_net: RW4
        bottom:
          row_net: RW3
        home:
          row_net: RW2
        top:
          row_net: RW1
        num:
          row_net: RW0
    thumbs:
      key:
        padding: 1kp
        spread: 1ky
        tags:
          - key
          - thumb_cluster
      anchor:
        ref: matrix_index_mod
        shift: [half_kx,-1.25ky]
        rotate: -50
      columns:
        t_col0:
          key:
            column_net: CL7
            height: 2ky
            shift: [0, half_ky]
          rows.far.skip: true
          rows.near.row_net: RW0
        t_col1:
          key:
            column_net: CL7
          rows.near.row_net: RW4
          rows.far.row_net: RW1
        t_col2:
          key:
            column_net: CL7
          rows.near.row_net: RW3
          rows.far.row_net: RW2
      rows:
        near:
        far:
    screw_top_left:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_outer_num
        shift: [half_kx, -half_ky]
    screw_top_center:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_index_num
        shift: [half_kx, half_ky]
    screw_top_right:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_innermod_num
        shift: [half_kx, -half_ky]
    screw_bottom_left:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_outer_mod
        shift: [half_kx, half_ky]
    screw_center:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_index_mod
        shift: [half_kx, -half_ky]
    screw_center_bottom:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_ring_mod
        shift: [half_kx, -half_ky]
    screw_thumbs_right_center:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: thumbs_t_col2_near
        shift: [-half_kx, half_ky]
    screw_bottom_right:
      key:
        tags:
          - helper
          - screws
      anchor:
        ref: matrix_innermod_bottom
        shift: [half_kx, half_ky]
    mcu_cover_top_left:
      key.tags:
        - helper
        - mcu
      anchor:
        - ref: matrix_innermod_num
          shift: [0.75kx,5]
    mcu_cover_top_right:
      key.tags:
        - helper
        - mcu
      anchor:
        - ref: mcu_cover_top_left
          shift: [mcu_width,0]
    mcu_cover_bottom_right:
      key.tags:
        - helper
        - mcu
      anchor:
        - ref: mcu_cover_top_right
          shift: [0,-mcu_height]
    mcu_cover_bottom_left:
      key.tags:
        - helper
        - mcu
      anchor:
        - ref: mcu_cover_top_left
          shift: [0,-mcu_height]
    screw_mcu_bottom_right:
      key.tags:
        - helper
        - screw
      anchor:
        - ref: mcu_cover_bottom_right
          shift: [1, -8]
outlines:
  _matrix_outline: #Outline around all keys only with half a key of padding around
    - what: polygon
      operation: stack
      points:
        - ref: matrix_outer_num
          shift: [-half_px,half_py]
        - ref: matrix_ring_num
          shift: [-half_px,half_py]
        - ref: matrix_middle_num
          shift: [-half_px,half_py]
        - ref: matrix_middle_num
          shift: [half_px,half_py]
        - ref: matrix_innermod_num
          shift: [half_px,half_py]
        - ref: matrix_innermod_bottom
          shift: [half_px,-half_py]
        - ref: thumbs_t_col2_far
          shift: [half_px,half_py]
        - ref: thumbs_t_col2_near
          shift: [half_px,-half_py]
        - ref: thumbs_t_col1_near
          shift: [-half_px,-half_py]
        - ref: matrix_index_mod
          shift: [-half_px,-half_py]
        - ref: matrix_ring_mod
          shift: [half_px, -half_py]
        - ref: matrix_pinky_mod
          shift: [half_px, -half_py]
        - ref: matrix_outer_mod
          shift: [-half_px,-half_py]
      fillet: 2
  _mcu_outline: # Outline around the MCU, angled at the botom to merge more cleanly with the matrix
    - what: polygon
      operation: stack
      points:
        - ref: mcu_cover_top_left
          shift: [-padding, padding]
        - ref: mcu_cover_top_right # bottom right space for the MCU
          shift: [padding, padding]
        - ref: mcu_cover_bottom_right
          shift: [padding, -2padding]
        - ref: mcu_cover_bottom_left
          shift: [-padding, -6padding]
      fillet: 2
  _mcu_tight: # Exact size of the MCU, used to show it's position on the combo dxf
    - what: polygon
      operation: stack
      points:
        - mcu_cover_top_left
        - mcu_cover_top_right
        - mcu_cover_bottom_right
        - mcu_cover_bottom_left
  _mcu_tolerance: # The MCU board with a tolerance gap - Used if we want to extend the switch plate to cover the whole PCB
    - what: outline
      name: _mcu_tight
      expand: board_tolerance
      fillet: 2
  ## PCB ##
  _pcb_outline: # Merged matrix and MCU outline to form the PCB shape
    - what: outline
      name: _mcu_outline
    - what: outline
      name: _matrix_outline
      operation: add
      fillet: 2
  ## Standoffs and screws ##
  _standoffs: # The circles for each screw showing standoff size
    - what: circle
      radius: standoff_size / 2
      where: /screw/
  _standoff_holes: # The heaset holes themselves for the bottom case
    - what: circle
      radius: heatset_hole / 2
      where: /screw/
  _screw_holes: # screw_holes for the bottom plate if not using a case
    - what: circle
      radius: screw_hole / 2
      where: /screw/
  _screw_heads:
    - what: circle
      radius: screw_head / 2
      where: /screw/
  ## Switch Plate ##
  _switch_cutouts: # Switch cutouts to form the switch plate
    - what: rectangle
      fillet: 2
      where: /key/
      size: [kcow, kcoh]
  switch_plate:
    - what: outline
      name: _matrix_outline
    - what: outline
      name: _standoff_holes
      operation: subtract
    - what: outline
      name: _switch_cutouts
      operation: subtract
  ## Case Wall ##
  _outer_wall: # 0.5 padding bigger than board - forms the outer wall of the case
    - what: outline
      name: _pcb_outline
      expand: 0.5padding
  _inner_wall: # Tolerance gap around the whole PCB, forms the inner wall of the case
    - what: outline
      name: _pcb_outline
      expand: board_tolerance
  _case_wall: # A wall from the inner and outer walls defined above
    - name: _outer_wall
    - operation: subtract
      name: _inner_wall
  combo:
    - name: _pcb_outline
    - operation: subtract
      name: _switch_cutouts
    - operation: subtract
      name: _mcu_tight
pcbs:
  board:
    template: kicad8
    outlines:
      main:
        outline: _pcb_outline
    footprints:
      mx:
        what: ceoloide/switch_mx
        where: /key/
        params:
          hotswap: true
          hotswap_pads_same_side: true
          reversible: true
          include_silkscreen: true
          include_corner_marks: true
          locked_traces_vias: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: ceoloide/diode_tht_sod123
        where: /key/
        params:
          reversible: true
          include_tht: true
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [diode_x, -diode_y]
          rotate: 90
      nice-nano:
        what: ceoloide/mcu_nice_nano
        params:
          reverse_mount: true
          reversible: true
          P1: CS
          P2: MOS
          P3: SCK
          P5: RW0
          P6: RW1
          P7: RW2
          P8: RW3
          P9: RW4
          P21: CL0
          P20: CL1
          P19: CL2
          P18: CL3
          P15: CL4
          P14: CL5
          P16: CL6
          P10: CL7
        where:
          ref: mcu_cover_top_left
          shift: [(mcu_width / 2), -(mcu_height / 2)]
      nice-view:
        what: ceoloide/display_nice_view
        where:
          ref: mcu_cover_bottom_left
          shift: [(mcu_width / 2), (mcu_height / 2) - 5]
        params:
          reversible: true
      battery_jst:
        what: ceoloide/battery_connector_jst_ph_2
        where:
          ref: mcu_cover_bottom_left
          shift: [mcu_width / 2 , -(mcu_height / 2)]
          rotate: -90
        params:
          reversible: true
          include_traces: true
      power_switch:
        what: ceoloide/power_switch_smd_side
        where:
          ref: mcu_cover_bottom_right
          shift: [(padding / 2), 0]
        params:
          reversible: true
          from: BAT_P
          to: VCC
      reset_switch:
        what: ceoloide/reset_switch_tht_top
        where:
          ref: mcu_cover_top_right
          shift: [padding / 2 , -half_px]
          rotate: 90
        params:
          reversible: true
      board_name:
        what: ceoloide/utility_text
        where:
          ref: matrix_outer_num
          shift: [0.5kx, 0.6ky]
        params:
          reversible: true
          bold: true
          height: 3
          width: 3
          text: "Ergo-Nano"
      board_version:
        what: ceoloide/utility_text
        where:
          ref: matrix_ring_num
          shift: [0, 0.5ky]
        params:
          reversible: true
          bold: true
          height: 3
          width: 3
          text: "V0.1"
      author:
        what: ceoloide/utility_text
        where:
          ref: matrix_outer_num
          shift: [0.6kx, 0.4ky]
        params:
          reversible: true
          bold: false
          height: 1
          width: 1
          text: "by Aevum Decessus"
      left_hand:
        what: ceoloide/utility_text
        where:
          ref: [matrix_inner_num]
          shift: [0.25kx, 0.5ky]
        params:
          side: F
          mirrored: false
          bold: true
          height: 3
          width: 3
          text: Left Hand
      right_hand:
        what: ceoloide/utility_text
        where:
          ref: [matrix_inner_num]
          shift: [0.25kx, 0.5ky]
        params:
          side: B
          mirrored: true
          bold: true
          height: 3
          width: 3
          text: Right Hand
      board_mounting_holes:
        what: ceoloide/mounting_hole_npth
        where: /screw/
        params:
          hole_size: screw_head
          hole_drill: screw_hole
          designator: 'MH'
      key_diode_routes:
        what: ceoloide/utility_router
        where: /key/
        params:
          net: "{{colrow}}"
          route: "f(-7.75,-5)(-7.75,0)(-5,3)"
          locked: true
      col_routes:
        what: ceoloide/utility_router
        where: /^matrix_.*_(?!num)/
        params:
          net: "{{col_net}}"
          route: "b(7.75,-5)(7.75,-6)(6,-8)(6,-17)(7.75,-19)(7.75,-24)"
          locked: true
cases:
  _xl_bottom:
    - name: _outer_wall
      extrude: plate_thickness
  _pcb_bottom:
    - name: _pcb_outline
      extrude: plate_thickness
  _wall_switch_plate:
    - name: _case_wall
      extrude: wall_height_switch_plate
  _wall_pcb:
    - name: _case_wall
      extrude: wall_height_pcb
  _case_standoffs:
    - name: _standoffs
      extrude: heatset_height
  _case_standoff_holes:
    - name: _standoff_holes
      extrude: heatset_height
  _pcb_plate_holes:
    - name: _screw_holes
      extrude: plate_thickness
  _case_bottom: # The bottom surface of the case with standoffs
    - what: case
      name: _xl_bottom
      operation: add
    - what: case
      name: _case_standoffs
      operation: add
    - what: case
      name: _case_standoff_holes
      operation: subtract
  bottom_plate: # Bottom plate with screw holes instead of a full case
    - what: case
      name: _pcb_bottom
      operation: add
    - what: case
      name: _pcb_plate_holes
      operation: subtract
  bottom_case_switch: # Case with walls to the surface of the switch plate
    - what: case
      name: _case_bottom
      operation: add
    - what: case
      name: _wall_switch_plate
      operation: add
  bottom_case_pcb: # Case with walls to the surface of the PCB
    - what: case
      name: _case_bottom
      operation: add
    - what: case
      name: _wall_pcb
      operation: add