meta:
  engine: 4.1.0
units:
  # Web View Resizing
  $default_width: U
  $default_height: U
  # Proxy Spacing Variables
  kx: U
  ky: U
  # Padding Variables
  padding: 10
  px: kx + padding
  py: ky + padding
  half_x: 0.5px
  half_y: 0.5py
points:
  zones:
    matrix:
      anchor:
        shift: [50, -125]
      columns:
        outer:
          key:
            column_net: COL0
        pinky:
          key:
            column_net: COL1
        ring:
          key:
            column_net: COL2
            stagger: 5
        middle:
          key:
            column_net: COL3
            stagger: 5
        index:
          key:
            column_net: COL4
            stagger: -5
          rows.mod.skip: true
        inner:
          key:
            column_net: COL5
            stagger: -5
          rows.mod.skip: true
      rows:
        mod:
          row_net: ROW4
        bottom:
          row_net: ROW3
        home:
          row_net: ROW2
        top:
          row_net: ROW1
        num:
          row_net: ROW0
    thumbs:
      key:
        padding: 1kx
        spread: 1ky
      anchor:
        ref: matrix_middle_mod
        shift: [0.5kx,-1.5ky]
        rotate: -50
      columns:
        top:
          key:
            column_net: COL6
            height: 2ky
            shift: [0, 0.5ky]
          rows.far.skip: true
          rows.near.row_net: ROW0
        middle:
          key:
            column_net: COL6
          rows.near.row_net: ROW4
          rows.far.row_net: ROW1
        bottom:
          key:
            column_net: COL6
          rows.near.row_net: ROW3
          rows.far.row_net: ROW2
      rows:
        near:
        far:
outlines:
  board:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_outer_num
          shift: [-half_x,half_y]
        - ref: matrix_ring_num
          shift: [-half_x,half_y]
        - ref: matrix_middle_num
          shift: [-half_x,half_y]
        - ref: matrix_middle_num
          shift: [half_x,half_y]
        - ref: matrix_inner_num
          shift: [half_x,half_y]
        - ref: matrix_inner_num # top right space for the MCU
          shift: [1.25px, half_y]
        - ref: matrix_inner_top # bottom right space for the MCU
          shift: [1.25px, -half_y]
        - ref: matrix_inner_bottom
          shift: [half_x,-half_y]
        - ref: thumbs_middle_far
          shift: [half_x,half_y]
        - ref: thumbs_bottom_far
          shift: [half_x,half_y]
        - ref: thumbs_bottom_near
          shift: [half_x,-half_y]
        - ref: thumbs_middle_near
          shift: [-half_x,-half_y]
        - ref: matrix_ring_mod
          shift: [half_x,-half_y]
        - ref: matrix_pinky_mod
          shift: [half_x, -half_y]
        - ref: matrix_outer_mod
          shift: [-half_x,-half_y]
      fillet: 5
  keys:
    - what: rectangle
      where: true
      size: [kx-0.5, ky-0.5]
  combo:
    - name: board
    - operation: subtract
      name: keys
pcbs:
cases:
